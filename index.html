<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e2030">
  <title>TapX</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="view"></canvas>
      <button id="gearBtn" aria-label="Settings"></button>
      <button id="bossBtn" hidden>FIGHT BOSS</button>
      <div id="toasts"></div>
    </div>
    <div id="skillbar">
      <div id="mana"><i id="manaFill"></i><span id="manaText"></span></div>
      <div id="skills"></div>
    </div>
    <div id="panel">
      <div id="panelHead"><span id="headStat"></span><span id="headCur"></span></div>
      <div id="panelTools"></div>
      <div id="panelBody"></div>
    </div>
    <nav id="tabs"></nav>
  </div>
  <div id="modal" hidden><div id="modalBox"></div></div>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/art.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
