name: TapX
version: '${version}'
main: dev.tapx.TapXPlugin
api-version: '1.21'
description: A Tap Titans-style idle game on a full-screen 2D map screen, plus server essentials, ranks, events and store tools.
author: nazeltron
softdepend: [LuckPerms, DiscordSRV, Essentials]
commands:
  tapx:
    description: Open TapX (admins - /tapx help)
    usage: /tapx [top|help|admin]
    aliases: [tap, taptitans]
    permission: tapx.play
permissions:
  tapx.play:
    description: Play TapX
    default: true
  tapx.bypass:
    description: Don't get put into the game automatically on join
    default: false
  tapx.admin:
    description: TapX admin commands (/tapx admin, /tapx gems, /tapx set, /event ...)
    default: op
  tapx.cmd.*:
    description: Every TapX essentials command (gmc, fly, tp, ban, vanish ...)
    default: op
  tapx.tag.owner:
    description: OWNER tag in chat and the tab list
    default: false
  tapx.tag.admin:
    description: ADMIN tag (ops get it automatically)
    default: false
  tapx.tag.mod:
    description: MOD tag
    default: false
  tapx.tag.helper:
    description: HELPER tag
    default: false
  tapx.chatgame:
    description: Start and stop chat games
    default: op
  tapx.chat.filter:
    description: Edit the chat filter (/chatfilter)
    default: op
  tapx.chat.delay:
    description: Set the chat delay (/chatdelay)
    default: op
  tapx.chat.bypass:
    description: Skip chat delay, repeat, caps and link checks (not the word filter)
    default: op
  tapx.staff.helper:
    description: Helper staff level (warn with chat punishments, see filter alerts)
    default: false
  tapx.staff.mod:
    description: Mod staff level (bans up to 14 days, /unwarn)
    default: false
  tapx.staff.admin:
    description: Admin staff level (permanent and IP bans, /clearwarns)
    default: false
