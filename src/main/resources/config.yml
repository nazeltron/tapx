# TapX configuration

# Players start with this many gems. Gems are the paid currency (sold on your web store and
# given with /tapx gems give <player> <amount>), so keep this small.
starting-gems: 25

# Most hours of "while you were away" gold a player can collect at once.
max-offline-hours: 12

# Clicks per second that count as taps. Stops auto-clickers from going wild.
max-taps-per-second: 20

# How often to save players who are playing, in minutes.
autosave-minutes: 5

# --- Game screen ---
# Put players straight into the game when they join (no /tapx needed).
# Players with the permission tapx.bypass are not auto-started.
auto-start: true
# Only operators (tapx.admin) can leave the game screen (EXIT button or /tapx leave).

# The game is shown on a wall of maps in a private void world (no resource pack needed).
# Name of that world (created automatically).
arcade-world: tapx_arcade
# The field of view (degrees) the screen is sized for; 70 is Minecraft's default.
# Each player can fine-tune the size in-game (Settings -> Screen size).
screen-fov: 70
# Window shape the screen is sized for (16:9). The screen covers the whole view.
screen-aspect: 1.778
# Screen updates per second, 2 to 40 (higher = smoother, more CPU and bandwidth). The cursor
# always moves 40 times a second. One player at 20 fps uses roughly 15% of one CPU core.
screen-fps: 20
# Map pixels per layout pixel: 2 = sharp 1792x1024 screen (14x8 maps), 1 = 896x512 (cheaper:
# about a quarter of the CPU and bandwidth, but it looks pixelated on big monitors).
screen-resolution: 2
# Background threads used to draw screens.
render-threads: 2

# Players on the game screen get a tiny resource pack that hides the crosshair and XP bar. It is
# served on the Minecraft port itself (no extra setup). Behind a proxy (Velocity/Bungee), upload
# plugins/TapX/tapx-screen-pack.zip somewhere and put its direct download link in resource-pack-url.
hide-crosshair: true
resource-pack-url: ""
# Used automatically if a player can't download the pack from the game port (e.g. some hosts).
# Animated rank tags, names and tab list (in tab and chat) through a second tiny resource pack that every
# player gets on join (a text shader). Players without it just see the normal colours.
text-animations: true
# Optional: host the UI pack elsewhere (the file is saved as plugins/TapX/tapx-ui-pack.zip).
ui-pack-url: ""
ui-pack-fallback-url: "https://raw.githubusercontent.com/nazeltron/tapx/claude/blissful-fermi-68xow0/pack/tapx-ui-pack.zip"
resource-pack-fallback-url: "https://raw.githubusercontent.com/nazeltron/tapx/claude/blissful-fermi-68xow0/pack/tapx-screen-pack.zip"

# --- Store, ranks and community ---
# Your web store (PayNow etc.), shown by /store.
store-url: "https://tapx.paynow.store"
ranks:
  # Also give LuckPerms groups named after the ranks (vip, pro, mvp, elite, titan, legend) if LuckPerms is installed.
  # Staff ranks (owner, admin, mod, helper) are given with /rank set <player> <rank>.
  luckperms: true
discord:
  # Invite link shown by /discord and /link. Linking itself needs the DiscordSRV plugin.
  invite: "https://discord.gg/drillnetwork"
  # Name of the bot players DM their /link code to (TapX's DiscordSRV uses DrillSim's bot, see setup/discordsrv-config.yml).
  bot-name: "DrillSim"
  # Link rewards only while the player is also in the Discord server.
  require-in-server: true
  # Remind unlinked players every N minutes (0 = never).
  reminder-minutes: 10
piggy-bank:
  # Real money spent (from /tapx payment) that fills the piggy bank; when full everyone gets an event.
  goal-usd: 100
  event-minutes: 30
  event-multiplier: 2
rules:
  - "Be kind to everyone."
  - "No cheating, macros or auto-clickers."
  - "No spam or advertising."
  - "Listen to staff."
tab:
  # MiniMessage title, the line under it, and the address in the footer (blank = the Discord invite).
  header: "<b><gradient:#ffcf3a:#ff7a3a:#ff5a8a>TapX</gradient></b>"
  # Written in small caps.
  season: "Season I"
  address: ""
chat:
  # Rank tags, name colours and a stats card when hovering a name.
  format: true
  first-join-broadcast: true
commands:
  # TapX commands replace vanilla ones (/msg, /tp ...). Set true to also replace other plugins' (EssentialsX).
  override-plugins: false

# --- Chat (3.4) ---
chat-filter:
  enabled: true
  # Blocked as whole words (also with s/es/er/ing/ed/y), with leetspeak, repeated letters and "f u c k" spacing undone.
  # Add more in game: /chatfilter add <word>  (or addstrict for words blocked even inside other words)
  words: [fuck, fuk, fuc, shit, bitch, cunt, dick, pussy, cock, whore, slut, bastard, asshole, ass, retard, retarded, nigga, nigger, faggot, fag, kys, porn, penis, vagina, rape, rapist]
  strict-words: [nigger, nigga, faggot, fuck]
  # Links and IP addresses to other servers are blocked (except these, the Discord invite and the store).
  block-links: true
  allowed-links: []
  # Seconds between messages (/chatdelay); mods and up skip this and the spam checks.
  delay-seconds: 2
  # How many times the same message may be sent within a minute.
  max-repeats: 1
  # Messages with more than this % capital letters (6+ letters) are lowercased.
  caps-percent: 60
chat-games:
  # A random chat game every N minutes when at least min-players are online (0 = only /chatgame).
  interval-minutes: 8
  min-players: 2
  reward-gems: 1
  # Gold reward, in monster kills' worth at the winner's stage.
  reward-gold-kills: 25
welcome:
  enabled: true
  line: "Tap titans, hire allies and climb the stages!"
  # Your server address, shown in the welcome message (blank = hidden).
  address: ""
warns:
  # Active warns expire after this many days (the history is kept).
  expire-days: 30
