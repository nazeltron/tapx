<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e2030">
  <title>TapX v1.0.0</title>
  <style>
:root {
  --bg: #1e2030;
  --panel: #2b2d3c;
  --row: #34374a;
  --row-edge: #232534;
  --text: #f4f4f8;
  --dim: #9aa0b8;
  --accent: #4fc3ff;
  --btn: #5b6074;
  --btn-edge: #3c4052;
  --font: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #0f1018; color: var(--text); font-family: var(--font); overflow: hidden; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }

#app {
  position: relative; display: flex; flex-direction: column;
  width: 100%; max-width: 520px; height: 100%; height: 100dvh; margin: 0 auto;
  background: var(--bg); user-select: none; -webkit-user-select: none;
}
#stage { position: relative; flex: 0 0 47%; min-height: 270px; overflow: hidden; }
#view { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }

#gearBtn { position: absolute; top: 8px; left: 8px; width: 40px; height: 40px; padding: 3px; border: 0; background: none; }
#bossBtn {
  position: absolute; top: 8px; right: 8px; padding: 8px 12px; border: 2px solid #111; border-radius: 6px;
  font-weight: 900; font-style: italic; font-size: 15px; letter-spacing: .5px; color: #fff;
  text-shadow: 0 2px 0 #000; box-shadow: 0 3px 0 rgba(0,0,0,.4);
}
#bossBtn.fight { background: linear-gradient(#ff7a4a, #c8301a); animation: pulse 1s infinite; }
#bossBtn.leave { background: linear-gradient(#4a4f62, #23263a); }
@keyframes pulse { 50% { transform: scale(1.06); } }

#toasts { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { max-width: 92%; padding: 7px 12px; border-radius: 8px; background: rgba(20,22,36,.88); font-size: 13px; font-weight: 700; text-align: center; transition: opacity .4s, transform .4s; }
.toast.ach { background: rgba(80,58,10,.92); border: 1px solid #ffd23a; }
.toast.out { opacity: 0; transform: translateY(8px); }

/* skill bar */
#skillbar { flex: 0 0 auto; padding: 6px 8px 6px; background: linear-gradient(#3a3d4f, #2b2d3c); border-top: 2px solid #15161f; }
#mana { position: relative; height: 12px; margin-bottom: 6px; border-radius: 6px; background: #151726; overflow: hidden; }
#manaFill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(#6ad8ff, #2a7fd0); transition: width .2s; }
#manaText { position: absolute; inset: 0; font-size: 10px; line-height: 12px; text-align: center; font-weight: 800; text-shadow: 0 1px 0 #000; }
#skills { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.skill { position: relative; height: 46px; padding: 0; border: 2px solid #15161f; border-radius: 8px; background: #20222f; overflow: hidden; display: grid; place-items: center; }
.skill .sico { display: block; }
.skill .cover { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(255,230,120,.35); }
.skill .slab { position: absolute; right: 2px; bottom: 1px; font-size: 11px; font-weight: 900; text-shadow: 0 1px 2px #000, 0 0 2px #000; color: #8ad8ff; }
.skill.active { border-color: #ffd23a; box-shadow: 0 0 10px #ffd23a; }
.skill.active .slab { color: #ffe08a; }
.skill.locked .sico, .skill:disabled .sico { filter: grayscale(1) brightness(.55); }
.skill.active:disabled .sico { filter: none; }
.skill .slock { position: absolute; font-size: 16px; }

/* panel */
#panel { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
#panelHead { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; background: #4a4d5e; font-size: 16px; color: #d0d3e0; }
#panelHead b { color: #fff; }
#panelTools { display: flex; gap: 6px; align-items: stretch; padding: 6px 8px; background: #1f2130; }
.tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; min-width: 70px; padding: 4px 6px; border: 0; border-radius: 6px; background: none; font-size: 11px; font-weight: 800; }
.tool.note { flex: 1; align-items: flex-start; text-align: left; font-weight: 600; color: var(--dim); font-size: 12px; }
.tool.mult { margin-left: auto; min-width: 104px; font-size: 18px; font-weight: 900; background: linear-gradient(#56807a, #34574f); border: 2px solid #1a2a26; box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
.badge { position: absolute; top: -2px; right: 4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #e8392a; color: #fff; font-size: 11px; font-style: normal; font-weight: 900; line-height: 18px; text-align: center; border: 2px solid #fff; }
#panelBody { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 12px; }

.row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--row); border-bottom: 3px solid var(--row-edge); }
.row .ico { flex: 0 0 auto; border-radius: 8px; box-shadow: 0 0 0 2px #15161f; }
.row .info { flex: 1 1 auto; min-width: 0; }
.row .name { font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .lvl { font-size: 13px; font-weight: 700; color: var(--dim); }
.row .lvl em { font-style: normal; color: var(--accent); }
.row .lvl .mana { margin-left: 8px; color: #8ad8ff; }
.row .desc { font-size: 12.5px; font-weight: 700; color: #c8cbd8; }
.dim { color: var(--dim); font-weight: 600; }

.buy {
  flex: 0 0 116px; display: flex; flex-direction: column; align-items: center; padding: 0 0 4px; overflow: hidden;
  border: 2px solid #15161f; border-radius: 4px; background: linear-gradient(#7a7f94, #5b6074); box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  font-weight: 900; line-height: 1.15;
}
.buy .top { align-self: stretch; padding: 3px 4px; margin-bottom: 3px; background: #3e4254; font-size: 14px; min-height: 22px; }
.buy .top:empty { display: none; }
.buy .mid { font-size: 15px; padding: 0 4px; }
.buy .bot { font-size: 12px; color: #e8ecff; }
.buy:not(:disabled):active { transform: translateY(1px); }
.buy:disabled { filter: saturate(.3) brightness(.75); }
.buy.gold { background: linear-gradient(#ffb43a, #e07a10); }
.buy.green { background: linear-gradient(#7fd13a, #4f9a1a); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.section { position: relative; margin: 8px 0 0; padding: 6px; text-align: center; background: #22243a; font-size: 18px; font-weight: 900; }
.section span { position: relative; }

.cur { display: inline-block; width: 1.05em; height: 1.05em; margin-right: 2px; vertical-align: -0.17em; background-size: contain; background-repeat: no-repeat; }

/* tabs */
#tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); padding-bottom: env(safe-area-inset-bottom); background: #15161f; }
.tab { position: relative; height: 54px; border: 0; border-top: 4px solid rgba(255,255,255,.25); background: var(--tc); display: grid; place-items: center; transition: transform .1s; }
.tab .tabico { filter: saturate(.6) brightness(.85); }
.tab.active { border-top-color: #fff; transform: translateY(-4px); box-shadow: 0 -4px 0 #fff; }
.tab.active .tabico { filter: none; transform: scale(1.12); }
.tab .badge { top: 2px; right: 6px; }

/* equipment */
.equipped { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px; background: #22243a; }
.eqslot { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.eqlabel { font-size: 11px; font-weight: 700; color: #c8cbd8; text-align: center; }
.gear-detail { padding: 8px 12px; font-size: 13px; min-height: 48px; background: #2f3245; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; padding: 8px; }
.cell { position: relative; padding: 0; border: 3px solid transparent; border-radius: 10px; background: none; display: grid; place-items: center; }
.cell.on { border-color: #fff; }
.cell .lv { position: absolute; right: 2px; bottom: 2px; padding: 0 3px; border-radius: 4px; background: rgba(0,0,0,.6); font-size: 10px; font-style: normal; font-weight: 800; }

/* shop cards */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; }
.cards.one { grid-template-columns: 1fr; }
.card { display: flex; flex-direction: column; align-items: center; padding: 0 0 6px; overflow: hidden; border: 2px solid #15161f; border-radius: 6px; background: linear-gradient(#3b8ab8, #23577f); font-weight: 900; }
.card:disabled { filter: saturate(.5) brightness(.75); }
.ctitle { align-self: stretch; padding: 5px 2px; background: rgba(0,0,0,.2); font-size: 13px; text-align: center; }
.csub { font-size: 13px; }
.cprice { align-self: stretch; margin-top: 4px; padding: 4px; background: rgba(0,0,0,.3); font-size: 16px; text-align: center; }
.deal-timer { text-align: center; font-size: 13px; font-weight: 700; color: var(--dim); padding-top: 6px; }

/* modal */
#modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(5,6,12,.65); }
#modal[hidden] { display: none; }
#modalBox { width: 100%; max-width: 440px; max-height: 88vh; display: flex; flex-direction: column; border: 3px solid #6d6f80; border-radius: 10px; background: #2b2d3c; box-shadow: 0 10px 40px rgba(0,0,0,.6); overflow: hidden; animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.mhead { display: flex; align-items: center; padding: 8px 12px; background: #4a4d5e; }
.mhead h2 { flex: 1; margin: 0; font-size: 22px; text-align: center; }
.mclose { border: 0; background: none; font-size: 22px; font-weight: 900; }
.mbody { padding: 12px 14px; overflow-y: auto; font-size: 15px; line-height: 1.4; }
.mbody p { margin: 0 0 8px; }
.mbody .big { font-size: 24px; font-weight: 900; text-align: center; }
.mfoot { display: flex; gap: 8px; justify-content: center; padding: 10px; background: #22243a; }
.mbtn { padding: 9px 18px; border: 2px solid #15161f; border-radius: 6px; background: linear-gradient(#7a7f94, #5b6074); font-size: 15px; font-weight: 900; }
.mbtn.gold { background: linear-gradient(#ffb43a, #e07a10); }
.mbtn.danger { background: linear-gradient(#e85a4a, #a8281a); }

.chest-result { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.loot { width: 96px; display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 12px; animation: pop .3s ease-out backwards; }
.loot:nth-child(2) { animation-delay: .1s; } .loot:nth-child(3) { animation-delay: .2s; } .loot:nth-child(4) { animation-delay: .3s; } .loot:nth-child(5) { animation-delay: .4s; }
.loot-extra { width: 100%; text-align: center; font-weight: 800; color: #6ae4ff; }

.ach-list { display: flex; flex-direction: column; gap: 8px; }
.ach { padding: 8px 10px; border-radius: 6px; background: var(--row); }
.aname { font-weight: 900; }
.stars i { font-style: normal; color: #555a70; }
.stars i.on { color: #ffd23a; }
.adesc { font-size: 13px; color: #c8cbd8; margin: 2px 0 6px; }
.bar { position: relative; height: 16px; border-radius: 8px; background: #151726; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#ffb43a, #e07a10); }
.bar span { position: absolute; inset: 0; font-size: 11px; line-height: 16px; text-align: center; font-weight: 800; text-shadow: 0 1px 0 #000; }

.settings .stats { display: grid; gap: 4px; margin-bottom: 12px; }
.settings .stats div { display: flex; justify-content: space-between; padding: 4px 8px; border-radius: 4px; background: var(--row); font-size: 14px; }
.settings .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.savebox { width: 100%; margin-top: 8px; border-radius: 6px; border: 0; padding: 6px; background: #151726; color: #fff; font-family: monospace; font-size: 11px; }

@media (min-width: 521px) { #app { border-left: 2px solid #000; border-right: 2px solid #000; } }
.version { margin-top: 10px; text-align: center; font-size: 12px; color: var(--dim); }

</style>
</head>

    <div id="stage">
      <canvas id="view"></canvas>
      <button id="gearBtn" aria-label="Settings"></button>
      <button id="bossBtn" hidden>FIGHT BOSS</button>
      <div id="toasts"></div>
    </div>
    <div id="skillbar">
      <div id="mana"><i id="manaFill"></i><span id="manaText"></span></div>

    </div>
    <nav id="tabs"></nav>
  </div>
  <div id="modal" hidden><div id="modalBox"></div></div>

'use strict';
// Shared helpers: math, seeded RNG, number formatting, synthesized sound.

const TAU = Math.PI * 2;
const FONT = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) {
    if (n < 10 && n % 1 !== 0) return (Math.floor(n * 10) / 10).toString();
    return Math.floor(n).toString();
  }
  const e = Math.floor(Math.log10(n) / 3);
  let v = n / Math.pow(1000, e);
  let s;
  if (e < SUFFIXES.length) s = SUFFIXES[e];
  else {
    const i = e - SUFFIXES.length;
    s = String.fromCharCode(97 + (Math.floor(i / 26) % 26)) + String.fromCharCode(97 + (i % 26));
  }
  const d = v >= 100 ? 0 : v >= 10 ? 1 : 2;
  const p = Math.pow(10, d);
  v = Math.floor(v * p) / p;
  return v.toFixed(d) + s;
}

function fmtTime(s) {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m`;
  if (m > 0) return `${m}:${String(sec).padStart(2, '0')}`;
  return `${sec}s`;
}

// Tiny Web Audio synth so the game needs no sound files either.
const Sfx = {
  ctx: null, on: true, last: {},
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; }
  },
  tone(freq, dur, type = 'square', vol = 0.04, slide = 0, delay = 0) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  throttle(key, ms) {
    const now = performance.now();
    if (this.last[key] && now - this.last[key] < ms) return false;
    this.last[key] = now; return true;
  },
  hit() { if (this.throttle('hit', 45)) this.tone(160 + Math.random() * 80, 0.07, 'square', 0.03, 0.5); },
  crit() { if (this.throttle('crit', 60)) { this.tone(520, 0.09, 'sawtooth', 0.04, 0.4); this.tone(260, 0.15, 'square', 0.03, 0.5, 0.02); } },
  coin() { if (this.throttle('coin', 70)) { this.tone(988, 0.05, 'square', 0.025); this.tone(1319, 0.09, 'square', 0.025, 0, 0.05); } },
  kill() { this.tone(220, 0.18, 'triangle', 0.06, 0.4); },
  boss() { this.tone(110, 0.4, 'sawtooth', 0.05, 0.6); this.tone(82, 0.5, 'square', 0.03, 0.7, 0.1); },
  levelUp() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.12, 'square', 0.03, 0, i * 0.06)); },
  buy() { if (this.throttle('buy', 40)) { this.tone(660, 0.06, 'triangle', 0.05); this.tone(990, 0.08, 'triangle', 0.04, 0, 0.04); } },
  error() { this.tone(140, 0.12, 'square', 0.03, 0.8); },
  thunder() { this.tone(90, 0.6, 'sawtooth', 0.08, 0.3); this.tone(1800, 0.1, 'square', 0.03, 0.2); },
  spell() { this.tone(440, 0.3, 'triangle', 0.05, 2); },
  chest() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.15, 'triangle', 0.045, 0, i * 0.07)); },
  pet() { this.tone(700, 0.12, 'sine', 0.06, 1.8); },
};

</script>

  <script>
'use strict';

// also run headless (see tools/sim.js).

const SAVE_KEY = 'tapx-save-v1';

// Presentation layers override these to react to game events.
const Hooks = {
  onTap() {}, onKill() {}, onSpawn() {}, onStage() {}, onSkill() {}, onToast() {},
  onBossFail() {}, onPetAttack() {}, onChange() {},
};

function freshState() {
  return {
    v: 1, gold: 0, gems: 100, relics: 0,
    stage: 1, wave: 0, maxStage: 1, farming: false,
    tapLevel: 1, heroes: {}, skills: {}, artifacts: {},
    mana: 30, buffs: {},
    gear: {}, equipped: {},
    pets: {}, activePet: null, petCharge: 0,
    achievements: {},
    freeChestAt: 0, deals: null,
    stats: { taps: 0, kills: 0, bosses: 0, crits: 0, goldEarned: 0, prestiges: 0, casts: 0, playTime: 0, bestStage: 1, relicsEarned: 0, wisps: 0 },
    settings: { sound: true, mult: 1 },
    lastSave: Date.now(),
  };
}

let S = freshState();
// Runtime-only state (not saved).
const R = { monster: null, bossTimer: 0, autoTapAcc: 0, nextSpawn: 0 };

// ---------- lookups ----------
const art = (id) => S.artifacts[id] || 0;
const heroLvl = (id) => S.heroes[id] || 0;
const skillLvl = (id) => S.skills[id] || 0;
const buffOn = (id) => (S.buffs[id] || 0) > 0;
const gearDef = (id) => GEAR.find((g) => g.id === id);
const petDef = (id) => PETS.find((p) => p.id === id);

function gearValue(id) {
  const g = gearDef(id), lvl = S.gear[id] || 0;
  if (!g || !lvl) return 0;
  const slot = GEAR_SLOTS.find((s) => s.id === g.slot);
  return slot.base * RARITIES[g.r].mult * (1 + 0.5 * (lvl - 1));
}
function gearBonus(stat) {
  let b = 0;
  for (const slot of GEAR_SLOTS) {
    const id = S.equipped[slot.id];
    if (id && slot.stat === stat) b += gearValue(id);
  }
  return b;
}
function petLevel(id) { return (S.pets[id] && S.pets[id].lvl) || 0; }
function petBonus(stat) {
  const p = S.activePet && petDef(S.activePet);
  if (!p || p.stat !== stat) return 0;
  return p.per * petLevel(p.id);
}

// ---------- formulas ----------
function monsterHp(stage) { return 10 * Math.pow(1.39, stage - 1) * (1 + Math.floor((stage - 1) / 5) * 0.08); }
function bossHp(stage) { return monsterHp(stage) * 6 * (1 - 0.04 * art('crown')); }
function goldMult() {
  return (1 + 0.25 * art('idol')) * (1 + gearBonus('gold')) * (1 + petBonus('gold')) * (buffOn('midas') ? skillPower('midas', skillLvl('midas')) : 1);
}
function killGold(stage) { return Math.ceil(monsterHp(stage) * 0.2) * goldMult(); }

function allDamageMult() { return (1 + 0.25 * art('blade')) * (buffOn('surge') ? 2 : 1); }

function heroMilestoneMult(lvl) {
  let m = 1;
  for (const [l, x] of HERO_MILESTONES) if (lvl >= l) m *= x;
  return m;
}
function heroBaseDps(h, lvl) { return lvl > 0 ? h.dps * lvl * heroMilestoneMult(lvl) : 0; }
function heroCost(h, lvl) { return h.cost * Math.pow(1.075, lvl); }
function allyMult() {
  return (1 + 0.35 * art('banner')) * (1 + gearBonus('ally')) * (1 + petBonus('ally')) * allDamageMult();
}
function rawHeroDps() { let d = 0; for (const h of HEROES) d += heroBaseDps(h, heroLvl(h.id)); return d; }
function heroDps(buffed = true) {
  return rawHeroDps() * allyMult() * (buffed && buffOn('warcry') ? skillPower('warcry', skillLvl('warcry')) : 1);
}

function tapBase(L) { return L * Math.pow(1.05, L - 1); }
function tapCost(L) { return 5 * Math.pow(1.074, L - 1); }
function tapDamage(buffed = true) {
  const base = tapBase(S.tapLevel) + 0.03 * rawHeroDps() * allyMult();
  return base * (1 + 0.4 * art('gauntlet')) * (1 + gearBonus('tap')) * (1 + petBonus('tap')) * allDamageMult()

}
function critChance() { return Math.min(0.9, 0.02 + 0.01 * art('clover') + (buffOn('eagle') ? skillPower('eagle', skillLvl('eagle')) / 100 : 0)); }
function critMult() { return 8 * (1 + 0.5 * art('fang')) * (1 + gearBonus('crit')) * (1 + petBonus('crit')); }
function bossTime() { return BOSS_TIME + 2 * art('hourglass'); }
function maxMana() { return 50 + 5 * art('crystal'); }
function manaRegen() { return (1 / 3) * (1 + 0.1 * art('crystal')) * (1 + petBonus('mana')); }
function spellDuration() { return 30 + 4 * art('tome'); }
function autoTapRate() {
  let r = 0;
  if (buffOn('frenzy')) r += skillPower('frenzy', skillLvl('frenzy'));
  if (buffOn('phantom')) r += 6;
  return r;
}
function relicsFor(stage) { return stage < PRESTIGE_STAGE ? 0 : Math.floor(Math.pow(stage - 15, 1.6) / 6 * (1 + 0.1 * S.stats.prestiges)); }
function artifactCost(a, lvl) { return Math.ceil(a.base * Math.pow(1.45, lvl)); }
function skillCost(sk, lvl) { return sk.cost * Math.pow(12, lvl); }
function petDamage() { const p = S.activePet; return p ? tapDamage() * (5 + 3 * petLevel(p)) : 0; }

// Bulk buying helpers for geometric costs.
function bulkCost(c0, r, n) { return c0 * (Math.pow(r, n) - 1) / (r - 1); }
function maxAffordable(c0, r, gold) {
  if (gold < c0) return 0;
  return Math.max(1, Math.floor(Math.log(1 + gold * (r - 1) / c0) / Math.log(r)));
}
function buyAmount(c0, r) {
  const m = S.settings.mult;
  if (m === 'max') return Math.max(1, maxAffordable(c0, r, S.gold));

}

// ---------- combat ----------
function spawnMonster() {
  const boss = !S.farming && S.wave >= WAVES;
  const mimic = !boss && Math.random() < 0.025 + 0.01 * art('key');
  const hp = boss ? bossHp(S.stage) : monsterHp(S.stage);

function dealDamage(amount, kind) {
  const m = R.monster;
  if (!m || m.dead) return;
  if (m.boss) amount *= 1 + petBonus('boss');
  m.hp -= amount;
  if (kind !== 'dps') m.hitT = 1;
  if (m.hp <= 0) { m.hp = 0; killMonster(); }

function addGold(g) { S.gold += g; S.stats.goldEarned += g; }

function killMonster() {
  const m = R.monster;
  m.dead = true; m.deathT = 0;
  let g = killGold(S.stage);
  if (m.boss) g *= 5;
  if (m.mimic) g *= 12;

  let gems = 0;

    S.stats.bosses++;

}

function advanceStage() {
  const n = Math.random() < 0.02 * art('boots') ? 2 : 1;
  S.stage += n; S.wave = 0; S.farming = false;
  S.maxStage = Math.max(S.maxStage, S.stage);
  S.stats.bestStage = Math.max(S.stats.bestStage, S.stage);
  Hooks.onStage(n);

function tap(auto) {

  if (!m || m.dead) return null;
  let d = tapDamage();

    S.petCharge++;

    ctx.fillStyle = L.cape;
    ctx.beginPath(); ctx.moveTo(-5, -33 + bob); ctx.quadraticCurveTo(-22, -28 + bob, -34 + w, -18 + w * 0.5);
    ctx.lineTo(-30 + w, -10); ctx.quadraticCurveTo(-18, -16, -2, -24 + bob); ctx.closePath(); fillStroke(ctx);
  }
  if (L.aura) {
    ctx.save(); ctx.globalAlpha = 0.5 + Math.sin(t * 3) * 0.2;
    ctx.fillStyle = L.aura;
    for (let i = 0; i < 6; i++) {
      const a = t * 1.6 + (i / 6) * TAU;
      circlePath(ctx, Math.cos(a) * 22, -28 + Math.sin(a) * 8 + Math.sin(t * 4 + i) * 3, 2.2); ctx.fill();
    }
    ctx.restore();
  }
  // legs
  const step = atk > 0 && atk < 1 ? Math.sin(atk * Math.PI) * 3 : 0;
  ctx.fillStyle = L.pants || '#3a3a4a';
  rrPath(ctx, -8 - step, -14, 6, 12, 2); fillStroke(ctx);
  rrPath(ctx, 2 + step, -14, 6, 12, 2); fillStroke(ctx);
  ctx.fillStyle = L.boots || '#4a2f1f';
  rrPath(ctx, -9 - step, -4, 9, 5, 2); fillStroke(ctx);
  rrPath(ctx, 1 + step, -4, 10, 5, 2); fillStroke(ctx);
  // body
  ctx.fillStyle = L.outfit; rrPath(ctx, -10, -35 + bob, 20, 23, 6); fillStroke(ctx);
  ctx.fillStyle = L.trim || '#e8c547'; ctx.fillRect(-9, -18 + bob, 18, 3);
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(-8, -33 + bob, 4, 13);
  // head
  const hy = -47 + bob;
  if (L.hairStyle === 'hood') {
    ctx.fillStyle = L.hood; circlePath(ctx, -1, hy, 15); fillStroke(ctx);
    ctx.fillStyle = L.skin; ctx.beginPath(); ctx.ellipse(3, hy + 2, 9, 9.5, 0, 0, TAU); fillStroke(ctx);
  } else {
    drawHair(ctx, L, hy, true);
    ctx.fillStyle = L.skin; circlePath(ctx, 0, hy, 12.5); fillStroke(ctx);
  }
  // face
  if (L.hairStyle !== 'helmet' && L.helmGear !== 'visor' && L.helmGear !== 'horned') {
    ctx.fillStyle = OUT;
    ctx.beginPath(); ctx.ellipse(3, hy + 1, 1.6, 2.6, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9, hy + 1, 1.5, 2.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,120,120,.35)'; circlePath(ctx, 8, hy + 6, 2.5); ctx.fill();
  }
  if (L.hairStyle !== 'hood') drawHair(ctx, L, hy, false);
  if (L.helmGear) drawHelmGear(ctx, L.helmGear, L.helmColor, hy);
  // weapon arm
  ctx.save();
  ctx.translate(7, -25 + bob);
  ctx.rotate(weaponAngle(L.weapon, atk));
  drawWeapon(ctx, L.weapon, L);
  ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  ctx.fillStyle = L.skin; circlePath(ctx, 0, 0, 3.4); fillStroke(ctx);
  ctx.restore();
  ctx.restore();
}

// ======================================================================
// Monsters: generated from a seed so every one looks different.
// ======================================================================
const NAME_A = ['Gor', 'Bub', 'Zar', 'Mok', 'Fen', 'Skul', 'Gri', 'Vex', 'Plo', 'Drak', 'Nib', 'Hux', 'Kra', 'Lum', 'Ooz', 'Ral', 'Bor', 'Snag', 'Wib', 'Qua'];
const NAME_B = ['ble', 'gax', 'rin', 'zle', 'mog', 'ix', 'ox', 'ath', 'uk', 'ling', 'bert', 'ra', 'nok', 'pip', 'dor', 'goo'];
const TITLES = ['the Vile', 'the Huge', 'the Unkind', 'Lord of Muck', 'the Ancient', 'the Gluttonous', 'Bonecrusher', 'the Eternal', 'the Dreadful'];
const SHAPES = ['blob', 'tower', 'cone', 'orb', 'brute', 'slime'];

function genMonster(seed, opts = {}) {
  const r = mulberry32(seed);
  const pick = (a) => a[Math.floor(r() * a.length)];
  const shape = pick(SHAPES);
  const hue = Math.floor(r() * 360);
  const sat = 40 + r() * 35, lit = 42 + r() * 14;
  const hsl = (l, s = sat, h = hue) => `hsl(${h},${s}%,${clamp(l, 4, 96)}%)`;
  const dims = { blob: [130, 125], tower: [92, 185], cone: [140, 180], orb: [112, 112], brute: [165, 150], slime: [150, 95] }[shape];
  const k = 0.88 + r() * 0.2;
  const spec = {
    shape, hue,
    w: dims[0] * k, h: dims[1] * k,
    color: hsl(lit), dark: hsl(lit - 16), light: hsl(lit + 18), belly: hsl(lit + 28, sat - 10),
    accent: hsl(55 + r() * 20, 70, 55, (hue + 150 + r() * 60) % 360),
    eyes: pick([1, 2, 2, 2, 3]), eyeR: 9 + r() * 6,
    mouth: pick(['grin', 'fangs', 'o', 'teeth', 'smile']),
    horns: r() < 0.5 ? pick(['curl', 'spike', 'antler']) : null,
    spikes: shape !== 'orb' && r() < 0.35,
    arms: shape !== 'slime' && shape !== 'orb' && r() < 0.6,
    legs: shape !== 'orb' && shape !== 'slime' && r() < 0.55,
    belly2: r() < 0.5, spots: r() < 0.35,
    float: shape === 'orb',
    name: pick(NAME_A) + pick(NAME_B),
    boss: !!opts.boss, mimic: !!opts.mimic,
  };
  if (spec.boss) spec.name += ' ' + pick(TITLES);
  if (spec.mimic) spec.name = 'Treasure Mimic';
  spec.spotSeed = Math.floor(r() * 1e6);
  return spec;
}

function bodyPath(ctx, sp) {
  const w = sp.w, h = sp.h;
  ctx.beginPath();
  switch (sp.shape) {
    case 'blob':
      ctx.moveTo(-w / 2, -h * 0.12);
      ctx.bezierCurveTo(-w / 2, -h * 1.02, w / 2, -h * 1.02, w / 2, -h * 0.12);
      ctx.quadraticCurveTo(w / 2, 0, w * 0.3, 0); ctx.lineTo(-w * 0.3, 0);
      ctx.quadraticCurveTo(-w / 2, 0, -w / 2, -h * 0.12);
      break;
    case 'tower':
      rrPath(ctx, -w / 2, -h, w, h, w * 0.42); return;
    case 'cone':
      ctx.moveTo(-w / 2, 0);
      ctx.quadraticCurveTo(-w * 0.28, -h * 0.55, -w * 0.05, -h * 0.97);
      ctx.quadraticCurveTo(0, -h * 1.02, w * 0.05, -h * 0.97);
      ctx.quadraticCurveTo(w * 0.28, -h * 0.55, w / 2, 0);
      ctx.closePath();
      break;
    case 'orb':
      ctx.arc(0, -h / 2, w / 2, 0, TAU); break;
    case 'brute':
      ctx.moveTo(-w * 0.36, 0);
      ctx.bezierCurveTo(-w * 0.62, -h * 0.5, -w * 0.5, -h * 0.92, -w * 0.12, -h * 0.95);
      ctx.quadraticCurveTo(0, -h * 1.08, w * 0.12, -h * 0.95);
      ctx.bezierCurveTo(w * 0.5, -h * 0.92, w * 0.62, -h * 0.5, w * 0.36, 0);
      ctx.closePath();
      break;
    case 'slime':
      ctx.moveTo(-w / 2, 0);
      ctx.bezierCurveTo(-w * 0.55, -h * 1.3, w * 0.55, -h * 1.3, w / 2, 0);
      for (let i = 4; i >= 0; i--) {
        const x0 = -w / 2 + (w * i) / 5;
        ctx.quadraticCurveTo(x0 + w / 10, 8 * ((i % 2) + 0.5), x0, 0);
      }
      ctx.closePath();
      break;
  }
}

function faceY(sp) {
  return { blob: 0.6, tower: 0.72, cone: 0.42, orb: 0.52, brute: 0.68, slime: 0.55 }[sp.shape] * sp.h;
}

function drawEye(ctx, x, y, r, blink, angry) {
  ctx.lineWidth = 2.5;
  if (blink) { ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.stroke(); return; }
  ctx.fillStyle = '#fff'; circlePath(ctx, x, y, r); fillStroke(ctx);
  ctx.fillStyle = OUT; circlePath(ctx, x - r * 0.3, y + r * 0.05, r * 0.52); ctx.fill();
  ctx.fillStyle = '#fff'; circlePath(ctx, x - r * 0.45, y - r * 0.2, r * 0.17); ctx.fill();
  if (angry) {
    ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x - r * 1.1, y - r * 1.25); ctx.lineTo(x + r * 1.1, y - r * 0.75); ctx.stroke();
  }
}

function drawMonster(ctx, sp, x, gy, t, m) {
  const hitT = m ? m.hitT : 0, deathT = m && m.dead ? m.deathT : 0;
  const spawn = m ? clamp(m.age * 4, 0, 1) : 1;
  if (sp.mimic) return drawMimic(ctx, sp, x, gy, t, hitT, deathT, spawn);
  const scale = (sp.boss ? 1.22 : 1) * (1 - deathT * 0.6) * (0.4 + 0.6 * spawn);
  const breathe = Math.sin(t * 2.4 + sp.hue) * 0.03;
  const sq = hitT * 0.09;
  const legH = sp.legs ? 16 : 0;
  const floatY = sp.float ? -24 + Math.sin(t * 2) * 6 : 0;
  ctx.save();
  ctx.globalAlpha = 1 - deathT;
  ctx.translate(x, gy);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(0, 0, sp.w * 0.45 * scale, 8 * scale, 0, 0, TAU); ctx.fill();
  ctx.scale(scale * (1 + sq - breathe), scale * (1 - sq + breathe));
  ctx.rotate(deathT * 0.4);
  ctx.translate(hitT * 6, floatY - legH);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = OUT; ctx.lineWidth = 4;
  const w = sp.w, h = sp.h, fy = -faceY(sp);

  if (sp.boss) {
    ctx.save(); ctx.globalAlpha *= 0.35 + Math.sin(t * 4) * 0.1;
    const g = ctx.createRadialGradient(0, -h / 2, 10, 0, -h / 2, w);
    g.addColorStop(0, '#ff3a3a'); g.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = g; circlePath(ctx, 0, -h / 2, w); ctx.fill();
    ctx.restore();
  }
  // legs (behind body)
  if (sp.legs) {
    ctx.fillStyle = sp.dark;
    const step = Math.sin(t * 3) * 2;
    rrPath(ctx, -w * 0.3, -6, w * 0.2, legH + 8 + step, 6); fillStroke(ctx);
    rrPath(ctx, w * 0.1, -6, w * 0.2, legH + 8 - step, 6); fillStroke(ctx);
  }
  // back spikes
  if (sp.spikes) {
    ctx.fillStyle = sp.accent;
    for (let i = 0; i < 7; i++) {
      const a = Math.PI * (1.08 + i * 0.14);
      const cx = Math.cos(a) * w * 0.47, cy = -h * 0.5 + Math.sin(a) * h * 0.5;
      const ox = Math.cos(a) * 18, oy = Math.sin(a) * 18;
      const px = -Math.sin(a) * 8, py = Math.cos(a) * 8;
      ctx.beginPath(); ctx.moveTo(cx - px, cy - py); ctx.lineTo(cx + ox, cy + oy); ctx.lineTo(cx + px, cy + py); ctx.closePath(); fillStroke(ctx);
    }
  }
  // horns
  if (sp.horns) {
    const hx = sp.shape === 'cone' ? w * 0.13 : w * 0.26;
    const hy = sp.shape === 'cone' ? -h * 0.78 : sp.shape === 'tower' ? -h * 0.95 : -h * 0.86;
    ctx.fillStyle = sp.horns === 'antler' ? '#c9a27a' : '#e9c48a';
    ctx.lineWidth = 3.5;
    for (const d of [-1, 1]) {
      ctx.beginPath();
      if (sp.horns === 'curl') {
        ctx.moveTo(d * (hx - 8), hy + 6);
        ctx.quadraticCurveTo(d * (hx + 4), hy - 42, d * (hx + 26), hy - 34);
        ctx.quadraticCurveTo(d * (hx + 32), hy - 20, d * (hx + 20), hy - 22);
        ctx.quadraticCurveTo(d * (hx + 14), hy - 24, d * (hx + 8), hy + 4);
      } else if (sp.horns === 'spike') {
        ctx.moveTo(d * (hx - 9), hy + 4); ctx.quadraticCurveTo(d * (hx + 2), hy - 20, d * (hx + 10), hy - 40); ctx.quadraticCurveTo(d * (hx + 10), hy - 14, d * (hx + 9), hy + 4);
      } else {
        ctx.moveTo(d * (hx - 3), hy + 4); ctx.lineTo(d * (hx - 1), hy - 30); ctx.lineTo(d * (hx - 12), hy - 44); ctx.lineTo(d * (hx + 3), hy - 34); ctx.lineTo(d * (hx + 16), hy - 46); ctx.lineTo(d * (hx + 6), hy - 26); ctx.lineTo(d * (hx + 7), hy + 4);
      }
      ctx.closePath(); fillStroke(ctx);
    }
    ctx.lineWidth = 4;
  }
  // arms
  if (sp.arms) {
    ctx.lineWidth = 13; ctx.strokeStyle = OUT;
    const sway = Math.sin(t * 3 + 1) * 6;
    for (const d of [-1, 1]) {
      const sx = d * w * 0.4, sy = -h * 0.45;
      const path = () => { ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(d * (w * 0.68), sy - 10 + sway * d, d * (w * 0.62), sy + 38 + sway); };
      path(); ctx.stroke();
      ctx.lineWidth = 8; ctx.strokeStyle = sp.dark; path(); ctx.stroke();
      ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.fillStyle = '#efe6d2';
      const cx = d * (w * 0.62), cy = sy + 38 + sway;
      for (let c = -1; c <= 1; c++) { ctx.beginPath(); ctx.moveTo(cx + c * 5, cy); ctx.lineTo(cx + c * 7, cy + 11); ctx.lineTo(cx + c * 5 + 3, cy + 1); ctx.closePath(); fillStroke(ctx); }
      ctx.lineWidth = 13;
    }
    ctx.lineWidth = 4;
  }
  // body
  bodyPath(ctx, sp);
  ctx.fillStyle = sp.color; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = sp.dark; ctx.beginPath(); ctx.ellipse(w * 0.42, -h * 0.35, w * 0.4, h * 0.75, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = sp.light; ctx.globalAlpha *= 0.55; ctx.beginPath(); ctx.ellipse(-w * 0.25, -h * 0.78, w * 0.18, h * 0.1, -0.5, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1 - deathT;
  if (sp.belly2) { ctx.fillStyle = sp.belly; ctx.beginPath(); ctx.ellipse(0, -h * 0.12, w * 0.32, h * 0.32, 0, 0, TAU); ctx.fill(); }
  if (sp.spots) {
    const r2 = mulberry32(sp.spotSeed); ctx.fillStyle = sp.dark;
    for (let i = 0; i < 6; i++) { circlePath(ctx, (r2() - 0.5) * w * 0.8, -r2() * h * 0.9, 4 + r2() * 7); ctx.fill(); }
  }
  if (hitT > 0) { ctx.fillStyle = `rgba(255,255,255,${hitT * 0.55})`; ctx.fillRect(-w, -h * 1.2, w * 2, h * 1.4); }
  ctx.restore();
  bodyPath(ctx, sp); ctx.stroke();
  // eyes
  const blink = (t + sp.hue * 0.01) % 3.7 < 0.12;
  const er = sp.eyeR;
  if (sp.eyes === 1) drawEye(ctx, 0, fy, er * 1.5, blink, sp.boss);
  else if (sp.eyes === 2) { drawEye(ctx, -er * 1.25, fy, er, blink, sp.boss); drawEye(ctx, er * 1.25, fy, er, blink, sp.boss); }
  else { drawEye(ctx, -er * 1.9, fy + 2, er * 0.85, blink, sp.boss); drawEye(ctx, 0, fy - er * 0.6, er, blink, sp.boss); drawEye(ctx, er * 1.9, fy + 2, er * 0.85, blink, sp.boss); }
  // mouth
  const my = fy + er * 2 + 4, open = 1 + hitT * 0.8;
  ctx.lineWidth = 3.5; ctx.fillStyle = '#4a1020';
  switch (sp.mouth) {
    case 'grin':
      ctx.beginPath(); ctx.moveTo(-20, my); ctx.quadraticCurveTo(0, my + 22 * open, 20, my); ctx.closePath(); fillStroke(ctx);
      ctx.fillStyle = '#fff'; ctx.fillRect(-9, my + 1, 7, 6); ctx.fillRect(2, my + 1, 7, 6);
      break;
    case 'fangs':
      ctx.beginPath(); ctx.moveTo(-18, my); ctx.lineTo(18, my); ctx.stroke();
      ctx.fillStyle = '#fff';
      for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * 12, my); ctx.lineTo(d * 8, my + 11 * open); ctx.lineTo(d * 4, my); ctx.closePath(); fillStroke(ctx); }
      break;
    case 'o':
      ctx.beginPath(); ctx.ellipse(0, my + 4, 7, 8 * open, 0, 0, TAU); fillStroke(ctx);
      break;
    case 'teeth':
      rrPath(ctx, -22, my - 2, 44, 14 * open, 5); fillStroke(ctx);
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(-20 + i * 8.5, my - 1); ctx.lineTo(-16 + i * 8.5, my + 6); ctx.lineTo(-12 + i * 8.5, my - 1); ctx.fill(); }
      break;
    default:
      ctx.beginPath(); ctx.arc(0, my - 4, 12, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  // boss crown
  if (sp.boss) {
    const top = sp.shape === 'orb' ? -h : -h - (sp.shape === 'cone' ? -4 : 2);
    ctx.fillStyle = '#ffcf3a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-20, top + 4); ctx.lineTo(-24, top - 22); ctx.lineTo(-10, top - 10); ctx.lineTo(0, top - 28); ctx.lineTo(10, top - 10); ctx.lineTo(24, top - 22); ctx.lineTo(20, top + 4); ctx.closePath(); fillStroke(ctx);
    ctx.fillStyle = '#e63950'; circlePath(ctx, 0, top - 6, 4); fillStroke(ctx);
  }
  ctx.restore();
}

function drawMimic(ctx, sp, x, gy, t, hitT, deathT, spawn) {
  const s = (1 - deathT * 0.6) * (0.4 + 0.6 * spawn);
  const chomp = Math.abs(Math.sin(t * 3)) * 0.35 + hitT * 0.3;
  ctx.save(); ctx.globalAlpha = 1 - deathT;
  ctx.translate(x, gy);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 0, 70 * s, 8 * s, 0, 0, TAU); ctx.fill();
  ctx.scale(s * (1 + hitT * 0.08), s * (1 - hitT * 0.08));
  ctx.translate(0, -Math.abs(Math.sin(t * 6)) * 6);
  ctx.strokeStyle = OUT; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  // base
  ctx.fillStyle = '#a8662f'; rrPath(ctx, -70, -70, 140, 70, 8); fillStroke(ctx);
  ctx.fillStyle = '#7a4520'; for (let i = -1; i <= 1; i++) ctx.fillRect(-68, -60 + i * 0 + i * 18 + 18, 136, 3);
  ctx.fillStyle = '#e8b83a'; rrPath(ctx, -74, -72, 14, 72, 4); fillStroke(ctx); rrPath(ctx, 60, -72, 14, 72, 4); fillStroke(ctx);
  // mouth interior
  ctx.fillStyle = '#3a0a14'; rrPath(ctx, -64, -86, 128, 20, 6); ctx.fill();
  ctx.fillStyle = '#ff6a8a'; ctx.beginPath(); ctx.ellipse(10, -74, 24, 8, 0.1, 0, TAU); ctx.fill();
  // lid
  ctx.save(); ctx.translate(-70, -72); ctx.rotate(-chomp);
  ctx.fillStyle = '#b8743a'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -34); ctx.quadraticCurveTo(70, -70, 140, -34); ctx.lineTo(140, 0); ctx.closePath(); fillStroke(ctx);
  ctx.fillStyle = '#e8b83a'; rrPath(ctx, 60, -16, 20, 22, 4); fillStroke(ctx);
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.moveTo(10 + i * 16, 0); ctx.lineTo(18 + i * 16, 12); ctx.lineTo(26 + i * 16, 0); ctx.closePath(); fillStroke(ctx); }
  ctx.restore();
  // eyes in the dark
  ctx.fillStyle = '#ffe34a'; circlePath(ctx, -24, -80, 6); ctx.fill(); circlePath(ctx, 24, -80, 6); ctx.fill();
  ctx.fillStyle = OUT; circlePath(ctx, -26, -80, 2.5); ctx.fill(); circlePath(ctx, 22, -80, 2.5); ctx.fill();
  if (hitT > 0) { ctx.fillStyle = `rgba(255,255,255,${hitT * 0.5})`; ctx.fillRect(-76, -140, 152, 140); }
  ctx.restore();
}

// ======================================================================
// Pets: little winged critters.
// ======================================================================
function drawPet(ctx, p, x, y, s, t, attack = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  const flap = Math.sin(t * 14) * 0.5;
  // wings
  ctx.fillStyle = p.wing;
  for (const d of [-1, 1]) {
    ctx.save(); ctx.scale(d, 1); ctx.rotate(flap * 0.6);
    ctx.beginPath(); ctx.moveTo(10, -4); ctx.quadraticCurveTo(30, -26, 40, -10); ctx.quadraticCurveTo(30, -8, 32, 2); ctx.quadraticCurveTo(22, 0, 10, 6); ctx.closePath(); fillStroke(ctx);
    ctx.restore();
  }
  // ears / horns
  ctx.fillStyle = p.ears === 'horns' ? '#f1e3c0' : p.body;
  if (p.ears !== 'none') for (const d of [-1, 1]) {
    ctx.beginPath();
    if (p.ears === 'fox') { ctx.moveTo(d * 6, -14); ctx.lineTo(d * 14, -30); ctx.lineTo(d * 17, -10); }
    else { ctx.moveTo(d * 5, -14); ctx.quadraticCurveTo(d * 10, -28, d * 16, -30); ctx.quadraticCurveTo(d * 14, -18, d * 13, -10); }
    ctx.closePath(); fillStroke(ctx);
  }
  // body
  ctx.fillStyle = p.body;
  if (p.fuzzy) {
    ctx.beginPath();
    for (let i = 0; i <= 20; i++) { const a = (i / 20) * TAU, rr = i % 2 ? 17 : 20; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); fillStroke(ctx);
  } else { ctx.beginPath(); ctx.ellipse(0, 0, 18, 19, 0, 0, TAU); fillStroke(ctx); }
  ctx.fillStyle = p.belly; ctx.beginPath(); ctx.ellipse(0, 8, 10, 8, 0, 0, TAU); ctx.fill();
  // face
  ctx.fillStyle = OUT;
  if (p.sleepy) { ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-9, -3); ctx.lineTo(-3, -3); ctx.moveTo(3, -3); ctx.lineTo(9, -3); ctx.stroke(); }
  else { circlePath(ctx, -6, -3, 2.6 + attack); ctx.fill(); circlePath(ctx, 6, -3, 2.6 + attack); ctx.fill(); ctx.fillStyle = '#fff'; circlePath(ctx, -6.8, -4, 0.9); ctx.fill(); circlePath(ctx, 5.2, -4, 0.9); ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-3, 3); ctx.lineTo(-1.5, 6); ctx.lineTo(0, 3); ctx.lineTo(1.5, 6); ctx.lineTo(3, 3); ctx.closePath(); fillStroke(ctx);
  if (p.bow) {
    ctx.fillStyle = '#ffd23a'; ctx.lineWidth = 2;

// ======================================================================
// Backgrounds (static layers cached to an offscreen canvas).
// ======================================================================
function makeBackground(world, W, H, gy, dpr) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.floor(W * dpr)); c.height = Math.max(1, Math.floor(H * dpr));
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr);
  const r = mulberry32(world.name.length * 1013 + 7);
  const sky = ctx.createLinearGradient(0, 0, 0, gy);
  sky.addColorStop(0, world.sky[0]); sky.addColorStop(1, world.sky[1]);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // sun / moon
  const dark = ['forest', 'lava', 'void'].includes(world.kind);
  ctx.save(); ctx.globalAlpha = 0.85;
  const sx = W * 0.8, sy = gy * 0.22;
  const sg = ctx.createRadialGradient(sx, sy, 4, sx, sy, 60);
  sg.addColorStop(0, dark ? '#fff8e0' : '#fffbe8'); sg.addColorStop(0.35, dark ? 'rgba(255,240,200,.6)' : 'rgba(255,250,220,.7)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg; circlePath(ctx, sx, sy, 60); ctx.fill();
  ctx.restore();

    ctx.fillStyle = '#fff';

  const mid = world.mid, md = world.midDark;
  const horizon = gy * 0.62;
  ctx.lineWidth = 1.5; ctx.strokeStyle = shade(md, -0.2);

    case 'castle': {

        const tw = 34 + r() * 30, th = 70 + r() * 80, tx = r() * W;
        ctx.fillStyle = shade(mid, -0.06); ctx.fillRect(tx, horizon - th, tw, th + gy);
        for (let k = 0; k < tw; k += 10) ctx.fillRect(tx + k, horizon - th - 8, 6, 8);
        ctx.fillStyle = shade(md, -0.25);
        for (let k = 0; k < 3; k++) rrPath(ctx, tx + tw / 2 - 4, horizon - th + 16 + k * 24, 8, 12, 4), ctx.fill();
        ctx.strokeStyle = shade(md, -0.2); ctx.beginPath(); ctx.moveTo(tx + tw / 2, horizon - th - 8); ctx.lineTo(tx + tw / 2, horizon - th - 26); ctx.stroke();
        ctx.fillStyle = '#d14b4b'; ctx.beginPath(); ctx.moveTo(tx + tw / 2, horizon - th - 26); ctx.lineTo(tx + tw / 2 + 12, horizon - th - 22); ctx.lineTo(tx + tw / 2, horizon - th - 18); ctx.fill();
      }
      // colonnade wall
      const wy = gy - gy * 0.32;
      ctx.fillStyle = mid; ctx.fillRect(0, wy, W, gy - wy);
      ctx.fillStyle = shade(mid, 0.25); ctx.fillRect(0, wy - 8, W, 10);
      ctx.fillStyle = md;
      for (let x = 10; x < W; x += 54) {
        rrPath(ctx, x, wy + 14, 36, gy - wy - 14, 18); ctx.fill();
      }
      ctx.fillStyle = shade(mid, 0.12);
      for (let x = 0; x < W; x += 54) ctx.fillRect(x, wy + 6, 9, gy - wy);
      ctx.strokeStyle = shade(md, -0.1); ctx.globalAlpha = 0.35;
      for (let y = wy + 12; y < gy; y += 12) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
      ctx.globalAlpha = 1;
      break;
    }
    case 'dunes': {
      for (let i = 0; i < 3; i++) {
        const px = r() * W, pw = 70 + r() * 70;
        ctx.fillStyle = mid; ctx.beginPath(); ctx.moveTo(px - pw, horizon + 30); ctx.lineTo(px, horizon - pw * 0.8); ctx.lineTo(px + pw, horizon + 30); ctx.fill();
        ctx.fillStyle = md; ctx.beginPath(); ctx.moveTo(px, horizon - pw * 0.8); ctx.lineTo(px + pw, horizon + 30); ctx.lineTo(px + pw * 0.2, horizon + 30); ctx.fill();
      }
      for (let k = 0; k < 2; k++) {
        ctx.fillStyle = k ? mid : shade(mid, 0.1);
        ctx.beginPath(); ctx.moveTo(0, gy);
        for (let x = 0; x <= W; x += 10) ctx.lineTo(x, gy - 40 - k * 20 + Math.sin(x / 70 + k * 2) * 18);
        ctx.lineTo(W, gy); ctx.fill();
      }
      for (let i = 0; i < 4; i++) { // cacti
        const cx = r() * W, ch = 30 + r() * 25;
        ctx.fillStyle = '#4f8a3a'; ctx.strokeStyle = shade('#4f8a3a', -0.4);
        rrPath(ctx, cx, gy - ch, 10, ch, 5); ctx.fill(); ctx.stroke();
        rrPath(ctx, cx - 10, gy - ch * 0.7, 8, 16, 4); ctx.fill(); ctx.stroke();
      }
      break;
    }
    case 'peaks': {
      for (let i = 0; i < 6; i++) {
        const px = (i / 5) * W + (r() - 0.5) * 60, ph = 90 + r() * 90, pw = 70 + r() * 50;
        ctx.fillStyle = md; ctx.beginPath(); ctx.moveTo(px - pw, gy - 20); ctx.lineTo(px, gy - 20 - ph); ctx.lineTo(px + pw, gy - 20); ctx.fill();
        ctx.fillStyle = mid; ctx.beginPath(); ctx.moveTo(px - pw * 0.35, gy - 20 - ph * 0.65); ctx.lineTo(px, gy - 20 - ph); ctx.lineTo(px + pw * 0.35, gy - 20 - ph * 0.65);
        ctx.lineTo(px + 10, gy - 20 - ph * 0.55); ctx.lineTo(px - 8, gy - 20 - ph * 0.68); ctx.closePath(); ctx.fill();
      }
      for (let i = 0; i < 9; i++) { // snowy pines
        const tx = r() * W, th = 26 + r() * 20;
        ctx.fillStyle = '#2f5a4a'; ctx.beginPath(); ctx.moveTo(tx, gy - th - 8); ctx.lineTo(tx - th * 0.4, gy - 6); ctx.lineTo(tx + th * 0.4, gy - 6); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(tx, gy - th - 8); ctx.lineTo(tx - th * 0.16, gy - th * 0.6); ctx.lineTo(tx + th * 0.16, gy - th * 0.6); ctx.fill();
      }
      break;
    }
    case 'forest': {
      for (let k = 0; k < 2; k++) {
        for (let i = 0; i < 14; i++) {
          const tx = r() * W, th = (k ? 90 : 130) + r() * 60;
          ctx.fillStyle = k ? mid : shade(world.far, -0.15);
          for (let j = 0; j < 3; j++) {
            ctx.beginPath(); ctx.moveTo(tx, gy - th + j * th * 0.22); ctx.lineTo(tx - th * (0.2 + j * 0.07), gy - th * 0.45 + j * th * 0.2); ctx.lineTo(tx + th * (0.2 + j * 0.07), gy - th * 0.45 + j * th * 0.2); ctx.fill();
          }

        }
      }
      for (let i = 0; i < 6; i++) { // glowing mushrooms
        const mx = r() * W;
        ctx.fillStyle = '#d8d0c0'; ctx.fillRect(mx - 2, gy - 10, 4, 10);
        ctx.fillStyle = '#7ef0c8'; ctx.beginPath(); ctx.arc(mx, gy - 10, 7, Math.PI, TAU); ctx.fill();
      }
      break;
    }
    case 'lava': {
      const lg = ctx.createLinearGradient(0, horizon, 0, gy);
      lg.addColorStop(0, '#ff9a2a'); lg.addColorStop(1, '#c2280e');
      ctx.fillStyle = lg; ctx.fillRect(0, horizon + 20, W, gy - horizon);
      for (let i = 0; i < 8; i++) {
        const rx = r() * W, rh = 60 + r() * 110, rw = 30 + r() * 40;
        ctx.fillStyle = mid; ctx.beginPath(); ctx.moveTo(rx - rw, gy); ctx.lineTo(rx - rw * 0.3, gy - rh); ctx.lineTo(rx + rw * 0.2, gy - rh * 0.8); ctx.lineTo(rx + rw, gy); ctx.fill();
        ctx.strokeStyle = '#ff6a1a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(rx - rw * 0.3, gy - rh * 0.8); ctx.lineTo(rx - rw * 0.1, gy - rh * 0.5); ctx.lineTo(rx - rw * 0.3, gy - rh * 0.25); ctx.stroke();
      }
      break;
    }
    case 'void': {
      for (let i = 0; i < 10; i++) {

        ctx.fillStyle = r() < 0.5 ? mid : '#7ef0ff'; ctx.globalAlpha = 0.6 + r() * 0.4;
        ctx.beginPath(); ctx.moveTo(cx, cy - cs); ctx.lineTo(cx + cs * 0.45, cy); ctx.lineTo(cx, cy + cs * 0.7); ctx.lineTo(cx - cs * 0.45, cy); ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1;
      for (let i = 0; i < 7; i++) {
        const cx = r() * W, ch = 40 + r() * 90;
        ctx.fillStyle = md; ctx.beginPath(); ctx.moveTo(cx - 14, gy); ctx.lineTo(cx - 6, gy - ch); ctx.lineTo(cx + 4, gy - ch - 14); ctx.lineTo(cx + 14, gy); ctx.fill();
        ctx.fillStyle = mid; ctx.beginPath(); ctx.moveTo(cx - 6, gy - ch); ctx.lineTo(cx + 4, gy - ch - 14); ctx.lineTo(cx + 2, gy); ctx.lineTo(cx - 10, gy); ctx.fill();
      }
      break;
    }
  }

  ctx.fillStyle = world.ground; ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = world.groundTop; ctx.fillRect(0, gy - 3, W, 7);
  ctx.fillStyle = world.dirt; ctx.fillRect(0, gy + 14, W, H - gy);
  ctx.fillStyle = shade(world.dirt, 0.15);
  for (let x = 0; x < W; x += 22) { ctx.fillRect(x + r() * 6, gy + 20 + r() * (H - gy - 26), 10 + r() * 8, 4); }
  ctx.fillStyle = shade(world.ground, -0.15);
  for (let x = 0; x < W; x += 28) ctx.fillRect(x, gy + 6, 16, 3);
  return c;
}

// Animated ambience drawn on top of the cached background.
function drawAmbience(ctx, world, W, gy, t) {
  if (['castle', 'dunes', 'peaks'].includes(world.kind)) {
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (let i = 0; i < 4; i++) {
      const x = ((t * (6 + i * 3) + i * 170) % (W + 160)) - 80, y = 30 + i * 26;
      ctx.beginPath(); ctx.ellipse(x, y, 30, 9, 0, 0, TAU); ctx.ellipse(x + 18, y - 6, 18, 9, 0, 0, TAU); ctx.ellipse(x - 16, y - 3, 14, 7, 0, 0, TAU); ctx.fill();
    }
  }
  if (world.kind === 'peaks') {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 40; i++) { const x = (i * 97 + Math.sin(t + i) * 20 + t * 10) % W, y = (i * 53 + t * (20 + (i % 5) * 6)) % gy; ctx.fillRect(x, y, 2.5, 2.5); }
  }
  if (world.kind === 'lava') {
    for (let i = 0; i < 25; i++) {
      const x = (i * 83) % W + Math.sin(t * 2 + i) * 8, y = gy - ((t * (25 + (i % 7) * 8) + i * 40) % gy);
      ctx.fillStyle = `rgba(255,${120 + (i % 4) * 30},40,${0.4 + (i % 3) * 0.2})`; ctx.fillRect(x, y, 3, 3);

    for (let i = 0; i < 18; i++) {

      ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 3 + i);
      ctx.fillStyle = world.kind === 'forest' ? '#d8ff7a' : '#9ff4ff'; circlePath(ctx, x, y, 2); ctx.fill();

}

}

  ctx.fillStyle = '#1aa6e0'; ctx.beginPath(); ctx.moveTo(r * 0.15, -r * 0.3); ctx.lineTo(r, -r * 0.3); ctx.lineTo(0, r); ctx.closePath(); ctx.fill();

}

  ctx.fillStyle = '#fff'; for (const d of [-1, 1]) { ctx.beginPath(); ctx.ellipse(d * r * 0.7, -r * 0.35, r * 0.55, r * 0.28, d * -0.5, 0, TAU); fillStroke(ctx); }

// Icon glyphs on a coloured tile, used throughout the UI.
const ICON_BG = {
  thunder: ['#2a6fe0', '#8fd0ff'], frenzy: ['#d04a2a', '#ffb06a'], warcry: ['#b8861a', '#ffe08a'], midas: ['#c9a01a', '#fff0a0'],
  berserk: ['#b3202a', '#ff7a4a'], eagle: ['#2a8a6a', '#a8ffd8'], surge: ['#d0502a', '#ffd23a'], phantom: ['#5a3ab0', '#c8a8ff'],
  shower: ['#c98a1a', '#ffe58a'], flask: ['#1a7ab0', '#8ae8ff'], blade: ['#5a6a80', '#d8e2f0'], gauntlet: ['#7a4a2a', '#e0b080'],

  <script>
'use strict';
// HTML panel UI: tabs, upgrade rows, shop, modals. Icons are small canvases
// painted by art.js.

const UI = { tab: 'hero', updaters: [], dirty: true };

const $ = (sel) => document.querySelector(sel);
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function iconCanvas(size, draw, cls = 'ico') {
  const c = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  c.width = c.height = Math.round(size * dpr);
  c.style.width = c.style.height = size + 'px';
  c.className = cls;
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  draw(x, size);
  return c;
}
const coinHtml = () => '<i class="cur coin"></i>';
const gemHtml = () => '<i class="cur gem"></i>';
const relicHtml = () => '<i class="cur relic"></i>';

// Currency glyphs are rendered once into data URLs and used as CSS backgrounds.
function initCurrencyIcons() {
  const make = (fn) => iconCanvas(32, (x) => fn(x)).toDataURL();
  const style = el('style');
  style.textContent = `
    .cur.coin{background-image:url(${make((x) => drawCoin(x, 16, 16, 13))})}
    .cur.gem{background-image:url(${make((x) => drawGem(x, 16, 17, 13))})}
    .cur.relic{background-image:url(${make((x) => drawRelic(x, 16, 16, 12))})}`;
  document.head.appendChild(style);
}

function portrait(look, size) {
  return iconCanvas(size, (x, s) => {
    const g = x.createLinearGradient(0, 0, 0, s); g.addColorStop(0, '#5fb3d9'); g.addColorStop(1, '#2d6f9a');
    x.fillStyle = g; rrPath(x, 1, 1, s - 2, s - 2, s * 0.14); x.fill();
    x.save(); rrPath(x, 1, 1, s - 2, s - 2, s * 0.14); x.clip();
    drawChibi(x, Object.assign({}, look, { cape: null, aura: null }), s * 0.47, s * 1.32, s / 46, 0, 0);
    x.restore();
  });
}
function lockedPortrait(size) {
  return iconCanvas(size, (x, s) => {
    x.fillStyle = '#2a2d3d'; rrPath(x, 1, 1, s - 2, s - 2, s * 0.14); x.fill();
    x.fillStyle = '#4a4e66'; x.font = `900 ${s * 0.5}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('?', s / 2, s / 2 + 2);
  });
}

// A standard upgrade row: icon | name/level/desc | action button.
function makeRow(icon, onClick) {
  const root = el('div', 'row');
  root.appendChild(icon);
  const info = el('div', 'info');
  const name = el('div', 'name'), lvl = el('div', 'lvl'), desc = el('div', 'desc');
  info.append(name, lvl, desc);
  const btn = el('button', 'buy');
  const top = el('span', 'top'), mid = el('span', 'mid'), bot = el('span', 'bot');
  btn.append(top, mid, bot);
  btn.addEventListener('click', () => { Sfx.init(); if (onClick() === false) { Sfx.error(); btn.classList.add('shake'); setTimeout(() => btn.classList.remove('shake'), 300); } else Sfx.buy(); refreshUI(); });
  root.append(info, btn);
  return { root, name, lvl, desc, btn, top, mid, bot, set(f, v) { if (this['_' + f] !== v) { this['_' + f] = v; this[f].innerHTML = v; } } };
}
function section(title) { return el('div', 'section', `<span>${title}</span>`); }

function multLabel() { const m = S.settings.mult; return m === 'max' ? 'BUY MAX' : `BUY x${m}`; }
function multButton() {
  const b = el('button', 'tool mult', multLabel());
  b.onclick = () => {
    const order = [1, 10, 100, 'max'];
    S.settings.mult = order[(order.indexOf(S.settings.mult) + 1) % order.length];
    b.textContent = multLabel(); refreshUI();
  };
  return b;
}
function toolButton(label, iconDraw, onClick, badgeFn) {
  const b = el('button', 'tool');
  if (iconDraw) b.appendChild(iconCanvas(30, iconDraw, 'tico'));
  b.appendChild(el('span', '', label));
  if (badgeFn) {
    const badge = el('i', 'badge');
    b.appendChild(badge);
    UI.updaters.push(() => { const n = badgeFn(); badge.textContent = n; badge.style.display = n ? '' : 'none'; });
  }
  b.onclick = onClick;
  return b;
}

// ---------------------------------------------------------------- tabs
const TABS = [
  { id: 'hero', color: '#e8643a', draw: (x, s) => drawIcon(x, 'tap', s) },
  { id: 'allies', color: '#3aa0b8', draw: (x, s) => { x.save(); rrPath(x, 1, 1, s - 2, s - 2, 6); x.clip(); drawChibi(x, Object.assign({}, HEROES[8].look, { cape: null }), s * 0.45, s * 1.3, s / 44, 0, 0); x.restore(); } },
  { id: 'gear', color: '#e3b72e', draw: (x, s) => drawGearIcon(x, GEAR.find((g) => g.id === 'a_dragon'), s, true) },
  { id: 'pets', color: '#58b04a', draw: (x, s) => drawPet(x, PETS[0], s / 2, s / 2 + 4, s / 70, 0.3) },
  { id: 'artifacts', color: '#8a5ad0', draw: (x, s) => drawRelic(x, s / 2, s / 2 + 2, s * 0.32) },
  { id: 'shop', color: '#2f8a86', draw: (x, s) => drawChest(x, CHESTS[2], s / 2, s / 2 + 4, s / 70) },
];
function buildTabs() {
  const nav = $('#tabs');
  nav.innerHTML = '';
  for (const t of TABS) {
    const b = el('button', 'tab');
    b.dataset.tab = t.id;
    b.style.setProperty('--tc', t.color);
    b.appendChild(iconCanvas(34, t.draw, 'tabico'));
    const dot = el('i', 'badge');
    b.appendChild(dot);
    b.onclick = () => { Sfx.init(); showTab(t.id); };
    nav.appendChild(b);
  }
}
function tabBadges() {
  for (const b of document.querySelectorAll('.tab')) {
    const dot = b.querySelector('.badge');
    let n = '';
    if (b.dataset.tab === 'shop' && freeChestReady()) n = '!';
    if (b.dataset.tab === 'artifacts' && ARTIFACTS.some((a) => (!a.max || art(a.id) < a.max) && S.relics >= artifactCost(a, art(a.id)))) n = '!';
    dot.textContent = n; dot.style.display = n ? '' : 'none';
    b.classList.toggle('active', b.dataset.tab === UI.tab);
  }
}

function showTab(id) {
  UI.tab = id;
  UI.updaters = [];
  const body = $('#panelBody'), tools = $('#panelTools');
  body.innerHTML = ''; tools.innerHTML = '';
  body.scrollTop = 0;
  ({ hero: renderHero, allies: renderAllies, gear: renderGear, pets: renderPets, artifacts: renderArtifacts, shop: renderShop })[id](body, tools);
  refreshUI();
}

function setHead(statFn, curFn) {
  UI.updaters.push(() => { $('#headStat').innerHTML = statFn(); $('#headCur').innerHTML = curFn(); });
}

// ---------------------------------------------------------------- hero tab
function renderHero(body, tools) {
  setHead(() => `<b>${fmt(tapDamage())}</b> Tap Damage`, () => `${coinHtml()} <b>${fmt(S.gold)}</b>`);
  tools.append(

  );
  const heroRow = makeRow(iconCanvas(56, (x, s) => {

    x.fillStyle = g; rrPath(x, 1, 1, s - 2, s - 2, 8); x.fill(); x.save(); rrPath(x, 1, 1, s - 2, s - 2, 8); x.clip();
    drawChibi(x, Object.assign(heroLook(), { cape: null, aura: null }), s * 0.47, s * 1.32, s / 46, 0, 0); x.restore();
  }), buyTap);

  body.appendChild(heroRow.root);
  UI.updaters.push(() => {
    const c0 = tapCost(S.tapLevel), n = buyAmount(c0, 1.074), cost = bulkCost(c0, 1.074, n);
    heroRow.set('lvl', `Lv. <em>${S.tapLevel}</em>`);
    heroRow.set('desc', `Tap Damage: ${fmt(tapDamage(false))} · Crit ${Math.round(critChance() * 100)}% x${fmt(critMult())}`);
    heroRow.set('top', `${coinHtml()}${fmt(cost)}`);

// ---------------------------------------------------------------- allies tab
function renderAllies(body, tools) {

  for (const p of PETS) {

    const row = makeRow(icon, () => { if (!petLevel(p.id)) return false; setActivePet(p.id); });

}

// ---------------------------------------------------------------- artifacts tab
function renderArtifacts(body, tools) {

// ---------------------------------------------------------------- shop tab
function renderShop(body, tools) {
  setHead(() => '<b>Shop</b>', () => `${gemHtml()} <b>${fmt(S.gems)}</b>`);
  tools.appendChild(el('div', 'tool note', 'Earn gems from bosses, achievements and wisps. Everything here is free to play.'));
  body.appendChild(section('Free Chest'));
  const free = el('div', 'cards one');

  fc.appendChild(el('div', 'ctitle', 'Free Chest'));
  fc.appendChild(iconCanvas(96, (x, s) => drawChest(x, { body: '#8a5a2a', band: '#c0c0c8' }, s / 2, s / 2 + 8, s / 64)));

  body.appendChild(section('Daily Deals'));

    const d = currentDeals();

    if (d.block !== block) {
      block = d.block; deals.innerHTML = '';

        card.appendChild(el('div', 'ctitle', p.name));

// ---------------------------------------------------------------- modals
function openModal(title, contentEl, buttons = [{ label: 'Close' }]) {
  const m = $('#modal'), box = $('#modalBox');
  box.innerHTML = '';
